services:
  db:
    image: postgres:16-alpine
    container_name: roomfinder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roomfinder
    ports:
      # 5438 on the host to avoid clashing with other local Postgres instances
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roomfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
